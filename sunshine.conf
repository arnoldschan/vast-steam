# Bind on all interfaces so Vast port-forwards can reach the UI
address = 0.0.0.0
origin_web_ui_allowed = wan
origin_pin_allowed = wan
# Overridden at start by SUNSHINE_BASE_PORT when using Vast host networking
port = 46989
capture = x11
encoder = nvenc
output_name = 0
min_log_level = 1
file_assets = /usr/share/sunshine
file_apps = /home/retro/.config/sunshine/apps.json
credentials_file = /home/retro/.config/sunshine/credentials.json
# csrf_allowed_origins is appended at container start for the public IP
